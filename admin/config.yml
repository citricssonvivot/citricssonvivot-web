backend:
  name: github
  repo: citricssonvivot/citricssonvivot-web
  branch: main
  base_url: https://github.com/login/oauth/authorize
  auth_endpoint: api/auth
  client_id: Ov23liXEtiMa4Y6u8jBb

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Páginas"
    files:
      - file: "index.html"
        label: "Página Principal"
        name: "home"
        fields:
          - { label: "Título", name: "title", widget: "string", default: "Cítrics Son Vivot" }
          - { label: "Descripción", name: "description", widget: "text" }
